name: 'order_entry'
version: '1.2.0'
config-version: 2

# The analytics project for the Order Entry warehouse. Models here are ingested
# into DataHub (dbt platform), which is how Blastradar knows their column-level
# lineage into the feature store and the ML models that train on them.
profile: 'order_entry'

model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  order_entry:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: analytics
