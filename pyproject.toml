[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blastradar"
version = "0.0.0"
description = "A CI agent that reviews data PRs for downstream ML impact via DataHub column-level lineage."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "acryl-datahub==1.6.0.15",  # pinned: verified in Phase 0; datahub.sdk is experimental
    "anthropic==0.120.0",        # the single LLM narration call (Phase 1C); pinned Opus 4.8 client
    "sqlglot",
    "pydantic",
    "httpx",
    "click",
]

# Requires Python 3.11+; verified working on 3.12.7 (3.11 unavailable locally,
# 3.13 avoided due to SDK-lag risk).

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
blastradar = "blastradar.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/blastradar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
